[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-control"
version = "0.1.0"
description = "Runtime agent safety platform — circuit breaker + flight recorder"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "frontier-ops[governance,kalman] @ file:///Users/joseph/frontier-ops",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dashboard = ["jinja2>=3.1"]
all = ["jinja2>=3.1"]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
mission-control = "mission_control.cli.main:main"

[tool.setuptools.packages.find]
include = ["mission_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
